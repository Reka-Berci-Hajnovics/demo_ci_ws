name: ROS 2 CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:jammy

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up ROS 2 Humble
        uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: humble

      - name: Install dependencies
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          sudo apt-get update
          rosdep update
          rosdep install \
            --from-paths src \
            --ignore-src \
            --rosdistro humble \
            -r -y

      - name: Build workspace
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          colcon build

      - name: Run unit tests
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          source install/setup.bash
          python3 -m pytest -q \
            src/gait_controller/test/test_gait_targets.py

      - name: Run gait controller integration test
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          source install/setup.bash
          launch_test \
            src/gait_controller/test/gait_main_integration.test.py

      - name: Run gait sequence system test
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          source install/setup.bash
          launch_test \
            src/gait_controller/test/gait_sequencer_integration.test.py

      - name: Run package tests
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          source install/setup.bash
          colcon test

      - name: Show test results
        if: always()
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          colcon test-result --verbose